<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRAYS E MATH</title>
</head>
<body>
    <h1>ARRAYS E MATH</h1>
    <h2>arrays</h2>
    <p id="resultado"></p>
    <script>
        //arrays é uma lista de itens
        //criação
        const nums = [4,7,8,9]
        const alunos = ["José", "Arthur", "Isabella", "Isadora", "Raquel"]

        const frutas = [];
        frutas[0] = "Mamão";
        frutas[1] = "Goiaba";
        const lanche = new array("Biscoito", "Bolo", "Macarrão");
    </script>
    <script>
        let resultado = document.getElementById("resultado");
        //acessar um valor passando um índice - 6a posição
        resultado.innerHTML = alunos[5];

        //imprimir a lista em formato de texto
        resultado.innerHTML = alunos.toString();

        //gera uma lista em formato JSON
        resultado.innerHTML = JSON.stringify(alunos);

        //número total de itens da lista
        resultado.innerHTML = alunos.length;

        //retorna o penúltimo número
        resultado.innerHTML = alunos[alunos.length-1]

        //ordenação
        resultado.innerHTML = alunos.sort();

        //adicionar valores
        resultado.innerHTML = alunos.push("Isis"); // retorna o comprimento da lista com esse novo item
        resultado.innerHTML = alunos.toString();

        //remover pop
        resultado.innerHTML = alunos.pop; //retorna o valor do item removido
        resultado.innerHTML = alunos.toString();

        //separador para os itens
        resultado.innerHTML = alunos.join(" - ");
    </script>
    <h2>MATH</h2>
    <p id="resultado2"></p>
    <script>
        let resultado2 = document.getElementById("resultado2");
        //arredonda para o mais próximo
        resultado2.innerHTML = "Arredonda o valor 'round': "+Math.round(5.3);
        //.ceil(5.4) - arredonda para cima
        //.floor(5.7) - arredonda para baixo

        resultado2.innerHTML = Math.min(4,8,7,5,6,3,2); //menor valor
        resultado2.innerHTML = Math.max(4,8,7,5,6,3,2); //maior valor

        //número randômico
        resultado2.innerHTML = Math.random();

        //número inteiro entre 0 e 100
        resultado2.innerHTML = Math.floor(Math.random()*100);
    </script>

    <label>
        Nome: <input type="text" id="nome"> <br>
        <button id="gerar">GERAR</button>
        <p id="textoformatado"></p>
    </label>
    <script>
        let gerar = document.querySelector("#gerar");
        //querySelector similar ao getElementById, a diferença é que aceita marcações com 'class', se tiver class usar: ".valorclass"
        gerar.addEventListener("click", function (e){
            const cores = ["cyan", "red", "yellow", "purple"]
            let nome = document.querySelector("#nome").value;
            //criar uma lista com cores e colocar o nome com uma cor da lista de forma aleatória
            document.querySelector("#textoformatado").style.color = cores[Math.floor(Math.random()*4)];
            document.querySelector("#textoformatado").innerHTML = nome;
        })
    </script>
    
</body>
</html>
